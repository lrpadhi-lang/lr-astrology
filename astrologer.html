<html lang="te">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LR జ్యోతిష్కులు">
<meta name="description" content="LR Astrology — జ్యోతిష్కుల యాప్">
<title>LR Astrology · జ్యోతిష్కులు</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Noto+Sans+Telugu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fdf7ec; --wheat:#e9d1a8; --sand:#6f4a2e; --sand2:#8b5e3c;
  --kumkum:#b3221f; --gold:#d97706; --green:#1f6f43; --ink:#3a2415;
  --tint:rgba(111,74,46,.12); --ui-font:'Noto Sans Telugu',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(233,209,168,.5)}
html,body{margin:0;padding:0;background:var(--cream)}
body{font-family:var(--ui-font);font-size:18px;line-height:1.55;color:var(--ink);
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:var(--wheat);color:var(--ink)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;line-height:inherit}
button{cursor:pointer}
.brand-name,.brand-disc{font-family:'Italianno','Segoe Script',cursive !important;font-weight:400 !important}

#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;overflow-x:hidden}
#hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--cream);border-bottom:1px solid var(--wheat)}
.disc{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--sand);color:var(--cream);
  display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;border:2px solid var(--kumkum);padding-bottom:4px}
.brand-name{font-size:30px;line-height:1;color:var(--sand);padding-bottom:2px}
#hdr .grow{flex:1 1 auto;min-width:0}
#hdr .who{font-size:13px;color:var(--sand2);margin-top:-2px}

.screen{display:none;padding:14px 14px 96px}
.screen.on{display:block}
h1,h2,h3{font-weight:700;color:var(--sand);margin:0 0 10px;line-height:1.35}
h1{font-size:23px} h2{font-size:20px} h3{font-size:18px}
.muted{color:var(--sand2);font-size:15px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:13px 20px;background:linear-gradient(90deg,var(--cream) 0%,var(--wheat) 100%);
  color:var(--sand);font-size:18px;font-weight:700;text-decoration:none}
.btn:active{background:linear-gradient(90deg,var(--wheat) 0%,var(--cream) 100%)}
.btn.block{display:flex;width:100%}
.btn.dark{background:linear-gradient(90deg,var(--sand2) 0%,var(--sand) 100%);color:var(--cream)}
.btn.kum{background:linear-gradient(90deg,var(--kumkum) 0%,#8f1a17 100%);color:var(--cream)}
.btn.green{background:linear-gradient(90deg,#2a8b57 0%,var(--green) 100%);color:var(--cream)}
.btn.sm{padding:9px 14px;font-size:16px;border-radius:10px}
.btn.ghost{background:var(--tint);color:var(--sand)}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1 1 0}

.panel{background:var(--sand);color:var(--cream);border-left:4px solid var(--kumkum);
  border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:14px}
.panel h2,.panel h3{color:var(--cream)}
.panel .muted{color:var(--wheat)}
.card{background:#fffaf1;border:1px solid var(--wheat);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}

.chip{display:inline-block;border:0;border-radius:999px;padding:4px 12px;background:var(--tint);
  color:var(--sand);font-size:14px;font-weight:600}
.chip.gold{background:rgba(217,119,6,.16);color:#8a4a05}
.chip.kum{background:rgba(179,34,31,.12);color:var(--kumkum)}
.chip.green{background:rgba(31,111,67,.14);color:var(--green)}
.chip.sel{background:var(--sand);color:var(--cream)}

.stat{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(233,209,168,.9)}
.stat:last-child{border-bottom:0}
.stat .k{color:var(--sand2);font-size:16px}
.stat .v{font-weight:700;color:var(--sand);text-align:right}
.panel .stat{border-bottom-color:rgba(233,209,168,.32)}
.panel .stat .k{color:var(--wheat)}
.panel .stat .v{color:var(--cream)}

.big-num{font-size:34px;font-weight:700;color:var(--cream);line-height:1.1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:#fffaf1;border:1px solid var(--wheat);border-radius:12px;padding:12px}
.mini .lab{font-size:14px;color:var(--sand2)}
.mini .num{font-size:24px;font-weight:700;color:var(--sand);line-height:1.2}

.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:var(--sand);color:var(--cream);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
  border:2px solid var(--wheat);background-size:cover;background-position:center}
.dot{width:11px;height:11px;border-radius:50%;position:absolute;right:-1px;bottom:-1px;border:2px solid #fffaf1}
.dot.on{background:var(--green)} .dot.off{background:var(--sand2);opacity:.55}

label.f{display:block;font-size:15px;font-weight:600;color:var(--sand);margin:12px 0 6px}
input.i,select.i,textarea.i{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--wheat);
  background:#fffaf1;font-size:18px}
input.i::placeholder{color:#a08a72}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;max-width:480px;margin:0 auto;
  background:var(--cream);border-top:1px solid var(--wheat);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabs.on{display:flex}
#tabs button{flex:1 1 0;border:0;background:transparent;padding:8px 2px 6px;border-radius:10px;
  color:var(--sand2);font-size:12.5px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;border-bottom:3px solid transparent;position:relative}
#tabs button.act{color:var(--kumkum);border-bottom-color:var(--gold)}
.badge{position:absolute;top:2px;right:10px;background:var(--kumkum);color:var(--cream);
  font-size:11px;font-weight:700;border-radius:999px;padding:1px 5px;min-width:17px;text-align:center}

#overlay{position:fixed;inset:0;z-index:60;display:none;background:rgba(58,36,21,.45)}
#overlay.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--cream);
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.full{position:absolute;inset:0;max-width:480px;margin:0 auto;background:var(--cream);display:flex;flex-direction:column}

#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);max-width:420px;width:calc(100% - 40px);
  background:var(--sand);color:var(--cream);border-left:4px solid var(--kumkum);border-radius:10px;
  padding:12px 16px;font-size:16px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* online switch */
.switchbar{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:12px;padding:14px 16px;
  background:linear-gradient(90deg,var(--cream) 0%,var(--wheat) 100%);text-align:left}
.switchbar .track{width:54px;height:30px;border-radius:999px;background:rgba(111,74,46,.25);position:relative;flex:0 0 54px;transition:background .2s}
.switchbar .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fffaf1;transition:left .2s}
.switchbar.on .track{background:var(--green)}
.switchbar.on .knob{left:27px}
.switchbar .lbl{font-size:18px;font-weight:700;color:var(--sand)}

/* incoming call */
.callscr{position:absolute;inset:0;background:var(--sand);color:var(--cream);display:flex;
  flex-direction:column;align-items:center;padding:28px 20px calc(24px + env(safe-area-inset-bottom))}
.callscr .avatar{width:96px;height:96px;flex:0 0 96px;font-size:34px;border-color:var(--kumkum);background:var(--sand2)}
.timer{font-size:44px;font-weight:700;letter-spacing:2px;color:var(--cream)}
.callbtns{display:flex;gap:26px;margin-top:auto}
.cbtn{width:74px;height:74px;border-radius:50%;border:0;font-size:15px;font-weight:700;color:var(--cream);
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:6px}
.cbtn.mute{background:var(--sand2)}
.cbtn.end{background:var(--kumkum)}
.cbtn.answer{background:var(--green);width:84px;height:84px;font-size:16px}
.cbtn.mute.on{background:var(--wheat);color:var(--sand)}
.ring{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.stamp{font-size:12px;color:var(--sand2);opacity:.8;text-align:center;margin-top:18px;line-height:1.5}
.notif{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed rgba(233,209,168,.9)}
.notif:last-child{border-bottom:0}
.notif .unread{width:8px;height:8px;border-radius:50%;background:var(--kumkum);flex:0 0 8px;margin-top:8px}
</style>
</head>

</div>

/* ---- audio ---- */
var AC = null;
function audioCtx(){
  var C = window.AudioContext || window.webkitAudioContext;
  if(!C) return null;
  if(!AC){ try{ AC = new C(); }catch(e){ AC = null; } }
  return AC;
}
function tone(ctx, freq, at, dur, vol, type){
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
function announce(text){
  try{
    if(!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'te-IN'; u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }catch(e){ /* speech unavailable */ }
}
function stopAudio(){
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  try{ if(AC && AC.state === 'running') AC.suspend(); }catch(e){}
  AC = null;
}

var ringTimer = null, ringTimeout = null;

function ringStart(customer){
  var ctx = audioCtx();
  if(ctx && ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
  var burst = function(){
    var c = audioCtx();
    if(!c) return;
    var n = c.currentTime + 0.02;
    tone(c, 740, n, 0.42, 0.09, 'sine');
    tone(c, 587, n + 0.24, 0.42, 0.09, 'sine');
  };
  burst();
  ringTimer = setInterval(burst, 1500);
  announce('కొత్త కాల్ వస్తోంది. ' + customer.name + ' గారి నుండి.');
}
function ringStop(){ clearInterval(ringTimer); ringTimer = null; stopAudio(); }

var demoCallTimer = null;
function scheduleDemoCall(){
  clearTimeout(demoCallTimer);
  if(!S.online || !S.unlocked || S.call) return;
  demoCallTimer = setTimeout(function(){
    if(!(S.online && S.unlocked && !S.call && !overlay.classList.contains('on'))) return;
    var req = pendingConsult();
    if(req) showIncoming(req); else showIncoming();
  }, 6000);
}

var lastConsultAt = null;
function initConsultCursor(){
  var all = lsGet('lrConsultRequests', []);
  /* anything already waiting is history; only newer requests ring */
  lastConsultAt = (Array.isArray(all) && all.length && all[all.length-1].at)
    ? all[all.length-1].at
    : new Date().toISOString();
}
function pendingConsult(){
  var all = lsGet('lrConsultRequests', []);
  if(!Array.isArray(all) || !all.length) return null;
  var last = all[all.length-1];
  if(!last || !last.at) return null;
  if(last.at > lastConsultAt){ lastConsultAt = last.at; return last; }
  return null;
}

function showIncoming(req){
  var c = req
    ? { id:'c_' + (req.at || Date.now()),
        name: req.mobile ? ('కస్టమర్ ' + String(req.mobile).slice(-4)) : 'కస్టమర్',
        mobile: req.mobile || '' }
    : CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)];
  S.call = {customer:c, seconds:0, muted:false, connected:false, phase:'ringing'};
  overlay.innerHTML = '<div class="full"><div class="callscr">'
    + '<div style="font-size:15px;color:var(--wheat)">ఇన్‌కమింగ్ కాల్</div>'
    + '<div class="avatar ring" style="margin:14px 0 10px">'+esc(c.name.trim().charAt(0))+'</div>'
    + '<div style="font-size:22px;font-weight:700;text-align:center">'+esc(c.name)+'</div>'
    + '<div style="color:var(--wheat);font-size:15px;margin-top:2px">'+esc(c.mobile)+'</div>'
    + '<div style="color:var(--wheat);font-size:15px;margin-top:8px">'+rupee(S.astro.fee)+' / నిమిషం</div>'
    + '<div class="timer" id="call-timer" style="margin-top:22px;font-size:30px">రింగ్ అవుతోంది…</div>'
    + '<div class="callbtns">'
    +   '<button class="cbtn end" id="btn-reject">తిరస్కరించు</button>'
    +   '<button class="cbtn answer" id="btn-accept">స్వీకరించు</button>'
    + '</div></div></div>';
  overlay.classList.add('on');
  ringStart(c);

  ringTimeout = setTimeout(function(){
    if(S.call && S.call.phase === 'ringing') finishCall('missed');
  }, 26000);
}

var callTimer = null, callStartAt = 0;

function acceptCall(){
  if(!S.call) return;
  clearTimeout(ringTimeout);
  ringStop();
  S.call.phase = 'in';
  S.call.connected = true;
  callStartAt = Date.now();

  var el = overlay.querySelector('.callscr');
  el.innerHTML = '<div style="font-size:15px;color:var(--wheat)">కాల్‌లో ఉంది</div>'
    + '<div class="avatar" style="margin:14px 0 10px">'+esc(S.call.customer.name.trim().charAt(0))+'</div>'
    + '<div style="font-size:22px;font-weight:700;text-align:center">'+esc(S.call.customer.name)+'</div>'
    + '<div class="timer" id="call-timer" style="margin-top:22px">00:00</div>'
    + '<div style="color:var(--wheat);font-size:14px;margin-top:4px">'+rupee(S.astro.fee)+' / నిమిషం</div>'
    + '<div class="callbtns">'
    +   '<button class="cbtn mute" id="btn-mute">మ్యూట్</button>'
    +   '<button class="cbtn end" id="btn-end">ముగించు</button>'
    + '</div>';

  callTimer = setInterval(function(){
    if(!S.call) return;
    S.call.seconds = Math.floor((Date.now() - callStartAt)/1000);
    var t = document.getElementById('call-timer');
    if(t) t.textContent = mmss(S.call.seconds);
  }, 500);
}

function finishCall(status){
  if(!S.call) return;
  var call = S.call;
  S.call = null;
  clearInterval(callTimer); callTimer = null;
  clearTimeout(ringTimeout);
  ringStop();

  var secs = call.connected ? Math.max(1, call.seconds) : 0;
  var mins = Math.max(1, Math.ceil(secs/60));
  var amount = call.connected ? mins * S.astro.fee : 0;
  var commission = Math.round(amount * (S.astro.commission/100));
  var share = amount - commission;

  var order = {
    id:'o' + Date.now(),
    customerId: call.customer.id,
    astrologerId: S.astro.id,
    type:'call',
    start: new Date().toISOString(),
    seconds: secs,
    amount: amount,
    commission: commission,
    astrologerShare: share,
    status: status
  };
  S.orders.push(order);

  if(share > 0){
    S.tx.push({amount: share, type:'credit', party:'astrologer', astrologerId: S.astro.id,
               note:'కాల్ · ' + call.customer.name, at: order.start});
  }
  S.notifs.push({
    title: status === 'done' ? 'కాల్ పూర్తయింది' : (status === 'missed' ? 'కాల్ తప్పిపోయింది' : 'కాల్ రద్దు'),
    body: call.customer.name + ' · ' + mmss(secs) + (share > 0 ? ' · ' + rupee(share) + ' జమ' : ''),
    at: order.start, read: false
  });
  save();
  closeOverlay();
  toast(status === 'done' ? 'కాల్ ముగిసింది · ' + rupee(share) : 'కాల్ తప్పిపోయింది');
  render();
  scheduleDemoCall();
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-tab],[data-act],#x-next,#x-next2,#x-back,#x-back2,#x-finish,#p-go,#pf-save,#pf-save2,#btn-accept,#btn-reject,#btn-mute,#btn-end') : null;
  if(!el) return;

  if(el.hasAttribute('data-tab')){ go(el.getAttribute('data-tab')); return; }

  if(el.id === 'btn-accept'){ acceptCall(); return; }
  if(el.id === 'btn-reject'){ finishCall('cancelled'); return; }
  if(el.id === 'btn-end'){ finishCall('done'); return; }
  if(el.id === 'btn-mute'){
    if(!S.call) return;
    S.call.muted = !S.call.muted;
    el.classList.toggle('on', S.call.muted);
    return;
  }

  /* entry */
  if(el.id === 'x-next'){
    var sel = (document.getElementById('x-id')||{}).value || '';
    var typed = ((document.getElementById('x-id2')||{}).value || '').trim();
    var id = typed || sel;
    var found = roster().filter(function(a){ return a.id === id; })[0];
    if(!found){ toast('జ్యోతిష్కుడిని ఎంచుకోండి లేదా సరైన ఐడీ ఇవ్వండి'); return; }
    S.entry.id = found.id; S.entry.name = found.name; S.entry.step = 2; renderEntry(); return;
  }
  if(el.id === 'x-back'){ S.entry.step = 1; renderEntry(); return; }
  if(el.id === 'x-back2'){ S.entry.step = 2; renderEntry(); return; }
  if(el.id === 'x-next2'){
    var mb = ((document.getElementById('x-mob')||{}).value || '').replace(/\D/g,'');
    if(!/^[6-9]\d{9}$/.test(mb)){ toast('సరైన మొబైల్ నంబర్ ఇవ్వండి'); return; }
    S.entry.mobile = mb; S.entry.step = 3; renderEntry(); return;
  }
  if(el.id === 'x-finish'){
    var p1 = ((document.getElementById('x-pin')||{}).value || '').trim();
    var p2 = ((document.getElementById('x-pin2')||{}).value || '').trim();
    if(!/^\d{4}$/.test(p1)){ toast('PIN 4 అంకెలు ఉండాలి'); return; }
    if(p1 !== p2){ toast('రెండు PIN ఒకటే ఉండాలి'); return; }
    var base = roster().filter(function(a){ return a.id === S.entry.id; })[0];
    S.astro = {
      id: base.id, name: base.name, languages: base.languages.slice(),
      fee: base.fee, exp: base.exp, spec: base.spec, photo: '',
      mobile: S.entry.mobile,
      commission: (typeof base.commission === 'number' ? base.commission : COMMISSION_DEFAULT),
      hours: '09:00 – 21:00'
    };
    S.pin = p1; S.unlocked = true; S.entry = {step:1,name:'',id:'',mobile:'',pin:'',pin2:''};
    save(); S.screen = 'home'; render();
    toast('స్వాగతం, ' + S.astro.name);
    scheduleDemoCall();
    return;
  }
  if(el.id === 'p-go'){
    var v = ((document.getElementById('p-in')||{}).value || '').trim();
    if(v !== S.pin){ toast('PIN తప్పు'); return; }
    S.unlocked = true; render(); scheduleDemoCall(); return;
  }

  /* profile saves */
  if(el.id === 'pf-save' || el.id === 'pf-save2'){
    var fee = Number((document.getElementById('pf-fee')||{}).value) || S.astro.fee;
    var hours = ((document.getElementById('pf-hours')||{}).value || '').trim();
    var langs = ((document.getElementById('pf-langs')||{}).value || '').split(',').map(function(x){return x.trim();}).filter(Boolean);
    var spec = ((document.getElementById('pf-spec')||{}).value || '').trim();
    S.astro.fee = Math.max(50, fee);
    S.astro.hours = hours || '09:00 – 21:00';
    S.astro.languages = langs.length ? langs : S.astro.languages;
    S.astro.spec = spec || S.astro.spec;
    S.settings.appId = ((document.getElementById('pf-appid')||{}).value || '').trim();
    S.settings.tokenServer = ((document.getElementById('pf-token')||{}).value || '').trim();
    save(); render(); toast('భద్రపరచబడింది');
    return;
  }

  /* data-act */
  var act = el.getAttribute('data-act');
  if(act === 'toggle'){
    S.online = !S.online;
    save(); render();
    if(S.online){ toast('ఆన్‌లైన్'); scheduleDemoCall(); }
    else { clearTimeout(demoCallTimer); toast('ఆఫ్‌లైన్'); }
    return;
  }
  if(act === 'photo'){
    var inp = document.getElementById('photo-in');
    if(inp) inp.click();
    return;
  }
  if(act === 'signout'){
    S.unlocked = false;
    S.astro = null; S.pin = ''; S.online = false;
    S.orders = []; S.tx = []; S.notifs = [];
    clearTimeout(demoCallTimer);
    save(); S.screen = 'home'; render(); return;
  }
});

/* photo upload, downscaled so localStorage stays small */
document.addEventListener('change', function(ev){
  if(ev.target && ev.target.id === 'photo-in'){
    var f = ev.target.files && ev.target.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var c = document.createElement('canvas');
        c.width = 200; c.height = 200;
        var g = c.getContext('2d');
        var s = Math.min(img.width, img.height);
        g.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 200, 200);
        S.astro.photo = c.toDataURL('image/jpeg', 0.8);
        save(); render(); toast('ఫోటో మార్చబడింది');
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  }
});

/* start */
initConsultCursor();
render();
})();
</script>
</body>
</html>
